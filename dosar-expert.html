<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Sistem Management Documente PNRAS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; 
            --dark-deep: #020617; /* Fundal foarte închis */
            --sidebar-bg: #0f172a; 
            --card-bg: #ffffff;
            --text-main: #f8fafc;
            --border-dark: #1e293b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--dark-deep); /* Contrast puternic */
            margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main);
        }

        /* SIDEBAR - VIZIBIL PERMANENT */
        .sidebar {
            width: 280px; background: var(--sidebar-bg); color: white;
            display: flex; flex-direction: column; border-right: 1px solid var(--border-dark); flex-shrink: 0;
        }

        .profile-box { padding: 20px; background: #000; border-bottom: 1px solid var(--border-dark); }
        .profile-box h3 { color: var(--primary); margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .profile-box h1 { margin: 5px 0 0; font-size: 16px; font-weight: 800; color: #fff; }

        .nav-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .an-label { display: block; font-size: 16px; font-weight: 800; color: var(--primary); margin: 15px 0 10px 5px; border-bottom: 1px solid var(--border-dark); padding-bottom: 5px; }

        .luni-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .luna-btn { 
            padding: 8px 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark); 
            border-radius: 8px; color: #94a3b8; font-size: 11px; font-weight: 600; 
            cursor: pointer; transition: 0.2s;
        }
        .luna-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .luna-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 800; }

        /* ZONA PRINCIPALA - CONTRAST PUTERNIC */
        .main-panel { 
            flex: 1; padding: 20px; display: flex; flex-direction: column; height: 100vh; 
            box-sizing: border-box; background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
        }

        #content-area {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 40px); /* Scădem puțin padding */
    overflow: hidden; /* Ascundem scroll-ul paginii mari */
}

        .clasa-card { 
            background: var(--card-bg); border-radius: 20px; padding: 20px; 
            border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: space-between;
            color: #0f172a; /* Text închis pe card alb */
        }

        .clasa-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* DOCS GRID */
        .docs-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 pe rând */
    gap: 5px;
}

        .doc-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 14px; 
            cursor: pointer; transition: 0.2s; padding: 12px 5px;
        }
        .doc-btn:hover { border-color: var(--primary); background: #fff; transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .doc-btn i { font-size: 28px; font-style: normal; margin-bottom: 8px; }
        .doc-btn label { font-size: 10px; font-weight: 700; color: #475569; text-align: center; cursor: pointer; line-height: 1.2; }

        .btn-exit { margin: 15px; padding: 12px; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #7f1d1d; border-radius: 10px; font-weight: 800; cursor: pointer; text-decoration: none; text-align: center; font-size: 12px; transition: 0.3s; }
        .btn-exit:hover { background: #ef4444; color: white; }

        .empty-hint { grid-column: span 2; grid-row: span 2; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 15px; text-align: center; font-weight: 500; }

/* Stil buton Ajutor - Adăugat */
        .btn-ajutor {
            display: block;
            margin: 20px 15px;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            font-size: 11px;
            transition: 0.3s;
        }
        .btn-ajutor:hover {
            background: var(--primary);
            color: white;
        }

/* --- STILURI NOI PENTRU AȘEZARE FRUMOASĂ --- */

/* Titluri de secțiune */
.section-header {
    margin: 5px 0;
    padding-bottom: 5px;
    font-size: 0.8rem;
    border-bottom: 1px solid #334155;
    flex-shrink: 0; /* Nu lăsăm să se turtească */
}

/* Container pentru documentele comune (sus) */
.common-docs-wrapper {
    display: flex;
    gap: 10px;
    padding: 8px 12px;
    margin-bottom: 10px;
    background: #1e293b;
    border-radius: 8px;
    border: 1px solid #334155;
    flex-shrink: 0; /* Rămâne fixă sus */
    align-items: center;
}

/* Cardurile comune să fie puțin mai speciale */
.common-card {
    background: linear-gradient(145deg, #10b981, #059669); /* Verde gradient */
    color: white;
    border: none !important;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.common-card:hover { transform: translateY(-2px); box-shadow: 0 8px 12px rgba(0,0,0,0.2); }

/* Card special pentru Proiecte (mov, distinct de clasele normale) */
.proiect-card {
    background: linear-gradient(145deg, #7c3aed, #5b21b6) !important;
    color: #fff !important;
}
.proiect-card .clasa-title { color: #fff !important; }

/* Grid-ul pentru clase (jos) */
.classes-grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* Se așază automat */
    gap: 20px;
    width: 100%;
}

/* ===== SLOTURI DOCUMENTE PROIECT (editabile) ===== */
.doc-slot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 14px; padding: 10px 5px; position: relative; min-height: 70px;
}
.doc-slot.empty {
    background: rgba(255,255,255,0.12); border: 1px dashed rgba(255,255,255,0.5);
    cursor: pointer; transition: 0.2s;
}
.doc-slot.empty:hover { background: rgba(255,255,255,0.22); transform: scale(1.03); }
.doc-slot.filled {
    background: rgba(255,255,255,0.95); color: #0f172a;
    border: 1px solid rgba(255,255,255,0.6);
}
.doc-slot-icon { font-size: 22px; margin-bottom: 4px; }
.doc-slot-label { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; }
.doc-slot-hint { font-size: 9px; opacity: 0.85; margin-top: 2px; }
.doc-slot-actions { display: flex; gap: 6px; margin-top: 6px; }
.doc-slot-actions button {
    border: none; background: #f1f5f9; border-radius: 8px; padding: 4px 7px;
    cursor: pointer; font-size: 12px; transition: 0.2s;
}
.doc-slot-actions button:hover { background: #e2e8f0; transform: scale(1.1); }
.doc-slot-actions button.del:hover { background: #fee2e2; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="profile-box">
            <h3>PNRAS DOSAR DIGITAL</h3>
            <h1 id="nume-expert-side">...</h1>
        </div>

        <div class="nav-scroll" id="sidebar-nav"></div>

        <a href="activitati.html" class="btn-exit">IEȘIRE SISTEM</a>
    </aside>

    <input type="file" id="file-input-proiect" style="display:none;" accept=".pdf,.jpg,.jpeg,.png,.heic,.heif,.doc,.docx">


    <main class="main-panel">
        <div id="content-area">
            <div class="empty-hint">Vă rugăm selectați o lună pentru a vizualiza documentele celor 4 clase.</div>
        </div>
    </main>

<script>
    const URL_S = 'https://aexjrbdgajurxzngfkpx.supabase.co';
    const KEY_S = 'sb_publishable_KPV__0BA9z4EvRl5eqC0FQ_hmBLOLYv';
    const supabaseClient = supabase.createClient(URL_S, KEY_S);

    // ===== R2 (Cloudflare) — identice cu dosar_lunar_v10.html, necesare pentru funcția Edge r2-upload =====
    const SB_URL_R2 = 'https://aexjrbdgajurxzngfkpx.supabase.co';
    const SB_KEY_R2 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFleGpyYmRnYWp1cnh6bmdma3B4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxMzE3NTYsImV4cCI6MjA4MzcwNzc1Nn0.VUx0QOKgjX4m23HOF2rBpE9vWA3T18KtjLc0w_iXhqA';

    // Starea curentă a vizualizării (pentru a putea reîncărca după upload/ștergere)
    let _viewState = { tip: null, luna: null, an: null };
    let _lastBtnEl = null;
    let _uploadTarget = null; // { numeProiect, tipDocument, oldId }

    const params = new URLSearchParams(window.location.search);
    const mod = params.get('mod');
    const expert = params.get('expert') || '';
    document.getElementById('nume-expert-side').innerText = (mod === 'proiecte') ? 'Toate Proiectele' : expert;

    const arhivaConfig = [
        { an: 2025, luni: ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"] },
        { an: 2026, luni: ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie"] }
    ];


    function buildSidebar() {
        const nav = document.getElementById('sidebar-nav');
        arhivaConfig.forEach(perioada => {
            const label = document.createElement('span');
            label.className = 'an-label';
            label.innerText = `Anul ${perioada.an}`;
            nav.appendChild(label);
            const grid = document.createElement('div');
            grid.className = 'luni-grid';
            perioada.luni.forEach(luna => {
                const btn = document.createElement('button');
                btn.className = 'luna-btn';
                btn.innerText = luna;
                btn.onclick = () => loadClase(luna, perioada.an, btn);
                grid.appendChild(btn);
            });
            nav.appendChild(grid);
        });

// Inserare buton Ajutor la finalul navigării
        const btnAjutor = document.createElement('a');
        btnAjutor.className = 'btn-ajutor';
        btnAjutor.innerText = 'AJUTĂ-MĂ!';
        btnAjutor.href = `ajuta.html?expert=${encodeURIComponent(expert)}`;
        nav.appendChild(btnAjutor);
    }

    function buildSidebarProiecte() {
        const nav = document.getElementById('sidebar-nav');
        const label = document.createElement('span');
        label.className = 'an-label';
        label.innerText = 'Toate Proiectele';
        nav.appendChild(label);

        const btnAjutor = document.createElement('a');
        btnAjutor.className = 'btn-ajutor';
        btnAjutor.innerText = 'AJUTĂ-MĂ!';
        btnAjutor.href = `ajuta.html`;
        nav.appendChild(btnAjutor);
    }

    async function loadToateProiectele() {
        const display = document.getElementById('content-area');
        display.innerHTML = "<div class='empty-hint' style='color:white;'>Se încarcă proiectele...</div>";
        _viewState = { tip: 'proiecte', luna: null, an: null };

        // Interogare: toate proiectele pontate, indiferent de expert, lună sau an
        const { data } = await supabaseClient.from('pontaj_detaliat')
            .select('nume_proiect')
            .eq('clase_grupe', 'PROIECT')
            .not('nume_proiect', 'is', null);

        const proiecteUnice = [...new Set((data || []).map(r => r.nume_proiect).filter(Boolean))].sort();

        if (proiecteUnice.length === 0) {
            display.innerHTML = `<div class="empty-hint" style="color:white;">Nu există niciun proiect pontat momentan.</div>`;
            return;
        }

        const docMap = await incarcaDocMapProiecte();

        let htmlContent = `<div class="section-header">🎯 Proiecte</div>`;
        htmlContent += `<div class="classes-grid-container">`;
        proiecteUnice.forEach(nume => {
            htmlContent += `
                <div class="clasa-card proiect-card">
                    <div class="clasa-title">🎯 ${nume}</div>
                    <div class="docs-grid">
                        ${slotProiect(nume, 'planificare', 'Planificare', '📅', docMap, 'planificare.html')}
                        ${slotProiect(nume, 'prezenta', 'Prezență', '👥', docMap, 'liste_prezenta.html')}
                        ${slotProiect(nume, 'masa', 'Masă', '🍱', docMap, 'liste_masa.html')}
                    </div>
                </div>
            `;
        });
        htmlContent += `</div>`;

        display.innerHTML = htmlContent;
    }

    async function loadClase(luna, an, btnEl) {
        // 1. Gestionare butoane active
        document.querySelectorAll('.luna-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        _viewState = { tip: 'clase', luna, an };
        _lastBtnEl = btnEl;

        const display = document.getElementById('content-area');
        display.innerHTML = "<div class='empty-hint' style='color:white;'>Se încarcă datele...</div>";

        // 2. Interogare baza de date
        const { data } = await supabaseClient.from('pontaj_detaliat')
            .select('clase_grupe, nume_proiect')
            .match({ expert: expert, luna: luna, an: an.toString() });

        if (!data || data.length === 0) {
            display.innerHTML = `<div class="empty-hint" style="color:white;">Nu există activități pontate pentru ${luna} ${an}.</div>`;
            return;
        }

        // 3. Extragere clase unice + proiecte unice (separate)
        let claseUnice = new Set();
        let proiecteUnice = new Set();
        data.forEach(p => {
            if (p.clase_grupe.trim() === 'PROIECT') {
                if (p.nume_proiect) proiecteUnice.add(p.nume_proiect);
            } else {
                p.clase_grupe.split(',').forEach(c => claseUnice.add(c.trim()));
            }
        });

        // 4. CONSTRUIRE HTML
        
        // --- SECȚIUNEA 1: Documente Comune (Sus) ---
        let htmlContent = `
            <div class="section-header">📂 Documente Lunare (Comune)</div>
            <div class="common-docs-wrapper">
                ${docItemStyled('Raport Activitate', '📊', 'raport.html', luna, an, 'General', 'common-card')}
                ${docItemStyled('Pontaj Lunar', '⏱️', 'pontaj_individual.html', luna, an, 'General', 'common-card')}
                ${docItemStyled('Orar General', '🕒', 'orar_individual.html', luna, an, 'General', 'common-card')}
                ${docItemDosar('📁 Dosar Lunar', luna, an)}
            </div>
        `;

        // --- SECȚIUNEA 2: Proiecte (dacă există) — DOAR VIZUALIZARE, gestionate din hub-ul central „Proiecte" ---
        if (proiecteUnice.size > 0) {
            const docMap = await incarcaDocMapProiecte();
            htmlContent += `<div class="section-header">🎯 Proiecte <span style="font-weight:400; font-size:0.75em; opacity:0.7;">(doar vizualizare — organizare din secțiunea Proiecte)</span></div>`;
            htmlContent += `<div class="classes-grid-container">`;
            proiecteUnice.forEach(nume => {
                htmlContent += `
                    <div class="clasa-card proiect-card">
                        <div class="clasa-title">🎯 ${nume}</div>
                        <div class="docs-grid">
                            ${slotProiectReadOnly(nume, 'planificare', 'Planificare', '📅', docMap)}
                            ${slotProiectReadOnly(nume, 'prezenta', 'Prezență', '👥', docMap)}
                            ${slotProiectReadOnly(nume, 'masa', 'Masă', '🍱', docMap)}
                        </div>
                    </div>
                `;
            });
            htmlContent += `</div>`;
        }

        // --- SECȚIUNEA 3: Documente per Clasă (Jos) ---
        if (claseUnice.size > 0) {
            htmlContent += `<div class="section-header">🏫 Documente per Clasă / Grupă</div>`;
            htmlContent += `<div class="classes-grid-container">`;

            claseUnice.forEach(clasa => {
                htmlContent += `
                    <div class="clasa-card">
                        <div class="clasa-title">Clasa ${clasa}</div>
                        <div class="docs-grid">
                            ${docItem('Planificare', '📅', 'planificare.html', luna, an, clasa)}
                            ${docItem('Fișe', '📄', 'fise.html', luna, an, clasa)}
                            ${docItem('Prezență', '👥', 'liste_prezenta.html', luna, an, clasa)}
                            ${docItem('Masă', '🍱', 'liste_masa.html', luna, an, clasa)}
                        </div>
                    </div>
                `;
            });

            htmlContent += `</div>`; // Închidem containerul de clase
        }

        display.innerHTML = htmlContent;
    }

    // Funcție ajutătoare pentru butoanele stilizate (documente comune)
    // O punem imediat sub loadClase sau docItem
    function docItemStyled(label, icon, link, luna, an, clasa, extraClass) {
        return `
            <div class="doc-btn ${extraClass}" onclick="window.open('${link}?luna=${luna}&an=${an}&clasa=${clasa}', '_blank')" 
                 style="padding: 15px 25px; display: flex; align-items: center; gap: 10px; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <span style="font-size: 1.2em;">${icon}</span>
                <span>${label}</span>
            </div>
        `;
    }

    function docItemDosar(label, luna, an) {
        return `
            <div class="doc-btn" 
                 onclick="window.open('dosar_lunar_v10.html?expert=${encodeURIComponent(expert)}&luna=${luna}&an=${an}', '_blank')"
                 style="padding: 15px 25px; display: flex; align-items: center; gap: 10px; border-radius: 8px; cursor: pointer; font-weight: 700; background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; border: none;">
                <span style="font-size: 1.3em;">📁</span>
                <span>${label}</span>
            </div>
        `;
    }

    function docItem(label, icon, link, luna, an, clasa) {
        return `
            <div class="doc-btn" onclick="window.open('${link}?expert=${encodeURIComponent(expert)}&luna=${luna}&an=${an}&clasa=${clasa}', '_blank')">
                <i>${icon}</i>
                <label>${label}</label>
            </div>
        `;
    }

    // ===================== DOCUMENTE PROIECT (editabile — încărcate manual, semnate) =====================
    // Tabel dedicat, complet separat de documente_r2 / liste_fisiere folosite de dosar_lunar_v10.html,
    // ca să nu existe niciun risc de interferență la generarea dosarului lunar per expert.

    async function incarcaDocMapProiecte() {
        const { data } = await supabaseClient.from('documente_proiect').select('*');
        const map = {};
        (data || []).forEach(d => { map[d.nume_proiect + '|' + d.tip_document] = d; });
        return map;
    }

    // Slot needitabil — folosit DOAR în vizualizarea individuală per-expert (loadClase).
    // Toată organizarea (editare, încărcare, înlocuire, ștergere) se face exclusiv din hub-ul central „Proiecte".
    function slotProiectReadOnly(numeProiect, tipDocument, label, icon, docMap) {
        const rec = docMap[numeProiect + '|' + tipDocument];
        if (rec) {
            return `
                <div class="doc-slot filled" style="cursor:pointer;" onclick="window.open('${rec.public_url}', '_blank')" title="${rec.nume_fisier || ''}">
                    <div class="doc-slot-icon">${icon}</div>
                    <div class="doc-slot-label">${label}</div>
                    <div class="doc-slot-hint">👁️ Vizualizează</div>
                </div>`;
        }
        return `
            <div class="doc-slot empty" style="cursor:default; opacity:0.55;">
                <div class="doc-slot-icon">${icon}</div>
                <div class="doc-slot-label">${label}</div>
                <div class="doc-slot-hint">În organizare</div>
            </div>`;
    }

    function slotProiect(numeProiect, tipDocument, label, icon, docMap, link) {
        const rec = docMap[numeProiect + '|' + tipDocument];
        const npSafe = numeProiect.replace(/'/g, "\\'");
        const expertPart = expert ? `&expert=${encodeURIComponent(expert)}` : '';
        const editUrl = `${link}?proiect=${encodeURIComponent(numeProiect)}${expertPart}`;
        if (rec) {
            return `
                <div class="doc-slot filled" title="${rec.nume_fisier || ''}">
                    <div class="doc-slot-icon">${icon}</div>
                    <div class="doc-slot-label">${label}</div>
                    <div class="doc-slot-actions">
                        <button onclick="event.stopPropagation(); window.open('${editUrl}', '_blank')" title="Editează">✏️</button>
                        <button onclick="event.stopPropagation(); window.open('${rec.public_url}', '_blank')" title="Deschide semnat">📂</button>
                        <button onclick="event.stopPropagation(); declanseazaInlocuire('${npSafe}', '${tipDocument}')" title="Înlocuiește semnat">🔄</button>
                        <button class="del" onclick="event.stopPropagation(); stergeDocProiect('${rec.id}')" title="Șterge semnat">🗑️</button>
                    </div>
                </div>`;
        }
        return `
            <div class="doc-slot empty">
                <div class="doc-slot-icon">${icon}</div>
                <div class="doc-slot-label">${label}</div>
                <div class="doc-slot-actions">
                    <button onclick="event.stopPropagation(); window.open('${editUrl}', '_blank')" title="Editează">✏️</button>
                    <button onclick="event.stopPropagation(); declanseazaUpload('${npSafe}', '${tipDocument}')" title="Încarcă semnat">📤</button>
                </div>
            </div>`;
    }

    function declanseazaUpload(numeProiect, tipDocument) {
        _uploadTarget = { numeProiect, tipDocument, oldId: null };
        document.getElementById('file-input-proiect').click();
    }

    async function declanseazaInlocuire(numeProiect, tipDocument) {
        const { data } = await supabaseClient.from('documente_proiect').select('id')
            .eq('nume_proiect', numeProiect).eq('tip_document', tipDocument).maybeSingle();
        _uploadTarget = { numeProiect, tipDocument, oldId: data ? data.id : null };
        document.getElementById('file-input-proiect').click();
    }

    async function reincarcaViewCurenta() {
        if (_viewState.tip === 'proiecte') await loadToateProiectele();
        else if (_viewState.tip === 'clase' && _lastBtnEl) await loadClase(_viewState.luna, _viewState.an, _lastBtnEl);
    }

    document.getElementById('file-input-proiect').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const target = _uploadTarget;
        e.target.value = '';
        if (!file || !target) return;
        await incarcaFisierProiect(file, target);
    });

    async function incarcaFisierProiect(file, target) {
        const cont = document.getElementById('content-area');
        const loadingMsg = document.createElement('div');
        loadingMsg.style.cssText = 'position:fixed;top:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:700;z-index:9999;';
        loadingMsg.innerText = '⏳ Se încarcă ' + file.name + '...';
        document.body.appendChild(loadingMsg);
        try {
            const numeSafe = target.numeProiect.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9_\-]/g, "_");
            const ext = (file.name.split('.').pop() || 'pdf');
            const objectKey = `documente_proiect/${numeSafe}/${target.tipDocument}_${Date.now()}.${ext}`;

            const R2_URL = `${SB_URL_R2}/functions/v1/r2-upload`;
            const presignResp = await fetch(R2_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY_R2}` },
                body: JSON.stringify({ action: 'upload', fileName: file.name, fileType: file.type || 'application/octet-stream', objectKey })
            });
            if (!presignResp.ok) throw new Error('R2 presign failed: ' + presignResp.status);
            const { presignedUrl, publicUrl } = await presignResp.json();

            const upResp = await fetch(presignedUrl, { method: 'PUT', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });
            if (!upResp.ok) throw new Error('R2 upload failed: ' + upResp.status);

            if (target.oldId) {
                await supabaseClient.from('documente_proiect').delete().eq('id', target.oldId);
            }
            await supabaseClient.from('documente_proiect').insert({
                nume_proiect: target.numeProiect,
                tip_document: target.tipDocument,
                nume_fisier: file.name,
                public_url: publicUrl,
                object_key: objectKey,
                expert: expert || null
            });

            await reincarcaViewCurenta();
        } catch (err) {
            alert('Eroare la încărcare: ' + err.message);
        } finally {
            loadingMsg.remove();
        }
    }

    async function stergeDocProiect(id) {
        if (!confirm('Sigur ștergi acest document semnat? (Fișierul rămâne pe server, doar legătura din dosar dispare.)')) return;
        await supabaseClient.from('documente_proiect').delete().eq('id', id);
        await reincarcaViewCurenta();
    }

    if (mod === 'proiecte') {
        buildSidebarProiecte();
        loadToateProiectele();
    } else {
        buildSidebar();
    }
</script>
