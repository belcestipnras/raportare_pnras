<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centralizare uniforme școlare</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1c2733; --muted:#6b7785; --line:#dfe4ea;
    --brand:#1f5fa8; --brand-d:#174a86; --ok:#1b8a4b; --err:#c0392b; --soft:#eaf1fa; --zero:#f0f2f5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--brand);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600;flex:1}
  header .who{font-size:13px;opacity:.9}
  header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:6px;cursor:pointer}
  main{max-width:1400px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .login{max-width:360px;margin:60px auto}
  .login h2{margin-top:0}
  input[type=password],input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
  button.primary{background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:6px;font:inherit;cursor:pointer}
  button.primary:hover{background:var(--brand-d)}
  button.ghost{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
  .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .row .grow{flex:1;min-width:220px}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  table{border-collapse:collapse;width:100%;background:#fff}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
  th{background:var(--soft);font-weight:600;font-size:13px}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
  td:first-child{background:#fff;font-weight:500}
  tr.tot td,tr.tot th{background:var(--soft);font-weight:700}
  tr.unit td{background:#dbe7f5;font-weight:700;text-align:left}
  td.num{font-variant-numeric:tabular-nums}
  td.zero{color:#b0b8c2}
  td.off{background:var(--zero)}
  td input{width:56px;padding:5px 4px;text-align:center;border:1px solid var(--line);border-radius:5px;font:inherit}
  td input.saved{border-color:var(--ok);background:#effaf3}
  td input.fail{border-color:var(--err);background:#fdf0ee}
  .muted{color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;display:none;z-index:9}
  .toast.err{background:var(--err)}
  .stat{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 12px}
  .stat div{background:var(--soft);border-radius:8px;padding:8px 14px}
  .stat b{display:block;font-size:20px}
  .err-msg{color:var(--err);margin:8px 0 0;min-height:1em}
  .pret input[type=text]{width:120px}
  .pret .mar{width:100%;min-width:320px}
  @media print{
    header,.tabs,.noprint,.toast{display:none!important}
    body{background:#fff}.card{border:0;padding:0}
    .tw{overflow:visible;border:0}
    th:first-child,td:first-child{position:static}
  }
</style>
</head>
<body>
<header>
  <h1>Centralizare uniforme școlare</h1>
  <span class="who" id="who"></span>
  <button id="btnOut" style="display:none">Ieșire</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://aexjrbdgajurxzngfkpx.supabase.co';
const SB_KEY = 'sb_publishable_KPV__0BA9z4EvRl5eqC0FQ_hmBLOLYv';

let cod = null;
let D = null;              // {nivel, clase, piese, comenzi}
let Q = new Map();         // "clasa|piesa|marime" -> cantitate
let tab = 'intro';
let clasaSel = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2});
const key = (c,p,m) => c+'|'+p+'|'+m;

function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast'+(err?' err':''); t.style.display='block';
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display='none', err?4500:1800);
}

async function rpc(fn, args){
  const r = await fetch(SB_URL+'/rest/v1/rpc/'+fn, {
    method:'POST',
    headers:{'Content-Type':'application/json', apikey:SB_KEY},
    body: JSON.stringify(args)
  });
  let body = null; try { body = await r.json(); } catch(e){}
  if(!r.ok) throw new Error((body && body.message) || 'Eroare de conexiune');
  return body;
}

function store(k,v){ try{ v===null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }

/* ---------- date ---------- */
function ingest(data){
  D = data;
  Q = new Map();
  D.comenzi.forEach(o => Q.set(key(o.clasa_id,o.piesa_id,o.marime), o.cantitate));
  if(!clasaSel || !D.clase.find(c=>c.id===clasaSel)) clasaSel = D.clase.length ? D.clase[0].id : null;
}
async function reload(){
  ingest(await rpc('uniforme_get_date', {p_cod:cod}));
}
const isAdmin = () => D && D.nivel === 'admin';
const qty = (c,p,m) => Q.get(key(c,p,m)) || 0;
const marimiAll = () => [...new Set(D.piese.flatMap(p=>p.marimi))].sort((a,b)=>Number(a)-Number(b));
const pieceQty = (clase, p) => { let s=0; Q.forEach((v,k)=>{ const [c,pp]=k.split('|'); if(+pp===p.id && clase.has(+c)) s+=v; }); return s; };
const unitIds = unit => new Set(D.clase.filter(c=>unit==='Toate'||c.unitate===unit).map(c=>c.id));
const priceOf = p => p.pret_unitar===null||p.pret_unitar===undefined ? null : Number(p.pret_unitar);

/* ---------- ecran login ---------- */
function showLogin(msg){
  $('#who').textContent=''; $('#btnOut').style.display='none';
  $('#app').innerHTML = `
    <div class="card login">
      <h2>Acces</h2>
      <p class="muted">Introdu codul primit pentru comenzile de uniforme.</p>
      <form id="fLogin">
        <input type="password" id="cod" placeholder="Cod de acces" autocomplete="current-password" autofocus>
        <p class="err-msg" id="lerr">${esc(msg||'')}</p>
        <button class="primary" type="submit" id="lbtn">Intră</button>
      </form>
    </div>`;
  $('#fLogin').onsubmit = async e => {
    e.preventDefault();
    const v = $('#cod').value.trim(); if(!v) return;
    $('#lbtn').disabled = true; $('#lerr').textContent='';
    try{ cod = v; await reload(); store('uf_cod', cod); start(); }
    catch(err){ cod=null; $('#lerr').textContent = err.message==='Cod invalid' ? 'Cod incorect.' : err.message; $('#lbtn').disabled=false; }
  };
}

/* ---------- schelet ---------- */
function start(){
  $('#who').textContent = isAdmin() ? 'Administrator' : 'Diriginte';
  $('#btnOut').style.display='';
  if(tab==='pret' && !isAdmin()) tab='intro';
  render();
}
$('#btnOut').onclick = () => { cod=null; D=null; store('uf_cod',null); showLogin(); };

function render(){
  const tabs = [['intro','Introducere pe clasă'],['clase','Centralizator clase'],['furn','Comandă furnizor']];
  if(isAdmin()) tabs.push(['pret','Prețuri și mărimi']);
  $('#app').innerHTML = `<div class="tabs">${tabs.map(([k,t])=>`<button data-t="${k}" class="${k===tab?'on':''}">${t}</button>`).join('')}</div><div id="view"></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = async () => {
    tab = b.dataset.t;
    if(tab!=='intro'){ try{ await reload(); }catch(e){ toast(e.message,true); } }
    render();
  });
  ({intro:viewIntro, clase:viewClase, furn:viewFurn, pret:viewPret})[tab]();
}

/* ---------- 1. Introducere pe clasă ---------- */
function viewIntro(){
  const sizes = marimiAll();
  const opts = ['Centru','Munteni','Tansa'].map(u =>
    `<optgroup label="${u}">${D.clase.filter(c=>c.unitate===u).map(c=>`<option value="${c.id}" ${c.id===clasaSel?'selected':''}>${esc(c.denumire)}</option>`).join('')}</optgroup>`).join('');
  $('#view').innerHTML = `
    <div class="card">
      <div class="row noprint">
        <button class="ghost" id="prev">&larr;</button>
        <div class="grow"><select id="selClasa">${opts}</select></div>
        <button class="ghost" id="next">&rarr;</button>
      </div>
      <div class="stat"><div>Bucăți în clasă<b id="stB">0</b></div><div>Valoare<b id="stV">–</b></div></div>
      <p class="muted noprint">Scrie numărul de bucăți în căsuța piesei și mărimii. Se salvează automat. Căsuțele gri nu există pentru piesa respectivă.</p>
      <div class="tw"><table>
        <thead><tr><th>Piesă</th>${sizes.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody>
        ${D.piese.map(p=>`<tr>
          <td>${esc(p.denumire)}</td>
          ${sizes.map(m=> p.marimi.includes(m)
              ? `<td><input type="number" min="0" max="10000" inputmode="numeric" data-p="${p.id}" data-m="${m}" value="${qty(clasaSel,p.id,m)||''}"></td>`
              : `<td class="off"></td>`).join('')}
          <td class="num" id="rt${p.id}">0</td></tr>`).join('')}
        <tr class="tot"><td>Total</td>${sizes.map(m=>`<td class="num" id="ct${m}">0</td>`).join('')}<td class="num" id="gt">0</td></tr>
        </tbody></table></div>
    </div>`;
  updClassTotals();
  const idx = () => D.clase.findIndex(c=>c.id===clasaSel);
  $('#selClasa').onchange = e => { clasaSel = +e.target.value; viewIntro(); };
  $('#prev').onclick = () => { const i=idx(); if(i>0){ clasaSel=D.clase[i-1].id; viewIntro(); } };
  $('#next').onclick = () => { const i=idx(); if(i<D.clase.length-1){ clasaSel=D.clase[i+1].id; viewIntro(); } };
  document.querySelectorAll('td input').forEach(inp => inp.addEventListener('change', saveCell));
}
function updClassTotals(){
  const sizes = marimiAll(); let all=0, val=0, priced=true;
  D.piese.forEach(p=>{
    let s=0; sizes.forEach(m=>{ s+=qty(clasaSel,p.id,m); });
    const el=$('#rt'+p.id); if(el) el.textContent=s;
    all+=s; const pr=priceOf(p); if(pr===null){ if(s>0) priced=false; } else val+=s*pr;
  });
  sizes.forEach(m=>{ let s=0; D.piese.forEach(p=>{ s+=qty(clasaSel,p.id,m); }); const el=$('#ct'+m); if(el) el.textContent=s; });
  $('#gt').textContent=all; $('#stB').textContent=all;
  $('#stV').textContent = priced ? fmt(val)+' lei' : fmt(val)+' lei (lipsesc prețuri)';
}
async function saveCell(e){
  const inp=e.target, p=+inp.dataset.p, m=inp.dataset.m, c=clasaSel;
  let v = parseInt(inp.value,10); if(isNaN(v)||v<0) v=0;
  inp.value = v||'';
  inp.classList.remove('saved','fail');
  try{
    await rpc('uniforme_salveaza',{p_cod:cod,p_clasa_id:c,p_piesa_id:p,p_marime:m,p_cantitate:v});
    if(v>0) Q.set(key(c,p,m),v); else Q.delete(key(c,p,m));
    inp.classList.add('saved'); updClassTotals();
  }catch(err){ inp.classList.add('fail'); toast('Nu s-a salvat: '+err.message, true); }
}

/* ---------- 2. Centralizator pe clase ---------- */
function viewClase(){
  const P = D.piese; let rows='', G = P.map(()=>0), GV=0, GT=0, missing=false;
  ['Centru','Munteni','Tansa'].forEach(u=>{
    const cl = D.clase.filter(c=>c.unitate===u); if(!cl.length) return;
    let S = P.map(()=>0), SV=0, ST=0;
    rows += `<tr class="unit"><td colspan="${P.length+3}">${u}</td></tr>`;
    cl.forEach(c=>{
      let t=0, v=0;
      const cells = P.map((p,i)=>{
        let s=0; p.marimi.forEach(m=>{ s+=qty(c.id,p.id,m); });
        t+=s; S[i]+=s; const pr=priceOf(p); if(pr===null){ if(s>0) missing=true; } else v+=s*pr;
        return `<td class="num ${s?'':'zero'}">${s||'–'}</td>`;
      }).join('');
      SV+=v; ST+=t;
      rows += `<tr><td>${esc(c.denumire)}</td>${cells}<td class="num"><b>${t||'–'}</b></td><td class="num">${t?fmt(v):'–'}</td></tr>`;
    });
    rows += `<tr class="tot"><td>Total ${u}</td>${S.map(s=>`<td class="num">${s}</td>`).join('')}<td class="num">${ST}</td><td class="num">${fmt(SV)}</td></tr>`;
    S.forEach((s,i)=>G[i]+=s); GV+=SV; GT+=ST;
  });
  $('#view').innerHTML = `
    <div class="card">
      <div class="row noprint"><button class="ghost" onclick="window.print()">Tipărește</button></div>
      <div class="stat"><div>Total bucăți<b>${GT}</b></div><div>Valoare totală<b>${fmt(GV)} lei</b></div></div>
      ${missing?'<p class="err-msg">Unele piese comandate nu au preț; valoarea e incompletă.</p>':''}
      <div class="tw"><table>
        <thead><tr><th>Clasa / grupa</th>${P.map(p=>`<th>${esc(p.denumire)}</th>`).join('')}<th>Total buc.</th><th>Valoare (lei)</th></tr></thead>
        <tbody>${rows}
        <tr class="tot"><td>TOTAL GENERAL</td>${G.map(s=>`<td class="num">${s}</td>`).join('')}<td class="num">${GT}</td><td class="num">${fmt(GV)}</td></tr>
        </tbody></table></div>
    </div>`;
}

/* ---------- 3. Comandă furnizor ---------- */
let furnUnit = 'Toate';
function viewFurn(){
  const ids = unitIds(furnUnit);
  const sizesAll = marimiAll();
  const colTot = {}; sizesAll.forEach(m=>{ colTot[m]=0; });
  const data = D.piese.map(p=>{
    const r = {}; let t=0;
    sizesAll.forEach(m=>{ let s=0; ids.forEach(c=>{ s+=qty(c,p.id,m); }); r[m]=s; t+=s; colTot[m]+=s; });
    return {p,r,t};
  });
  const sizes = sizesAll.filter(m=>colTot[m]>0);
  let GT=0, GV=0, missing=false;
  const body = data.map(({p,r,t})=>{
    const pr=priceOf(p); if(pr===null && t>0) missing=true;
    const v = pr===null?0:t*pr; GT+=t; GV+=v;
    return `<tr><td>${esc(p.denumire)}</td>${sizes.map(m=>`<td class="num ${r[m]?'':'zero'}">${r[m]||'–'}</td>`).join('')}
      <td class="num"><b>${t}</b></td><td class="num">${pr===null?'—':fmt(pr)}</td><td class="num">${t&&pr!==null?fmt(v):'–'}</td></tr>`;
  }).join('');
  $('#view').innerHTML = `
    <div class="card">
      <div class="row noprint">
        <div><select id="fu">${['Toate','Centru','Munteni','Tansa'].map(u=>`<option ${u===furnUnit?'selected':''}>${u}</option>`).join('')}</select></div>
        <button class="ghost" onclick="window.print()">Tipărește</button>
        <button class="ghost" id="csv">Descarcă CSV</button>
      </div>
      <h3 style="margin:4px 0 10px">Comandă către furnizor — ${esc(furnUnit)}</h3>
      <div class="stat"><div>Total bucăți<b>${GT}</b></div><div>Valoare<b>${fmt(GV)} lei</b></div></div>
      ${missing?'<p class="err-msg">Unele piese comandate nu au preț.</p>':''}
      ${GT===0?'<p class="muted">Nu există încă cantități introduse.</p>':`
      <div class="tw"><table>
        <thead><tr><th>Piesă \\ Mărime</th>${sizes.map(m=>`<th>${m}</th>`).join('')}<th>Total</th><th>Preț (lei)</th><th>Valoare (lei)</th></tr></thead>
        <tbody>${body}
        <tr class="tot"><td>Total</td>${sizes.map(m=>`<td class="num">${colTot[m]}</td>`).join('')}<td class="num">${GT}</td><td></td><td class="num">${fmt(GV)}</td></tr>
        </tbody></table></div>`}
    </div>`;
  $('#fu').onchange = e => { furnUnit=e.target.value; viewFurn(); };
  $('#csv').onclick = () => {
    const head = ['Piesa',...sizes,'Total','Pret','Valoare'];
    const lines = [head, ...data.map(({p,r,t})=>{ const pr=priceOf(p); return [p.denumire,...sizes.map(m=>r[m]||0),t,pr===null?'':pr,pr===null?'':(t*pr).toFixed(2)]; })];
    const csv = '﻿'+lines.map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='comanda_uniforme_'+furnUnit.toLowerCase()+'.csv'; a.click();
  };
}

/* ---------- 4. Prețuri și mărimi (admin) ---------- */
function viewPret(){
  $('#view').innerHTML = `
    <div class="card pret">
      <p class="muted">Prețul unitar, în lei (cu virgulă sau punct). Mărimile se scriu separate prin virgulă. O mărime scoasă din listă nu mai apare la introducere; cantitățile deja salvate pentru ea rămân în baza de date.</p>
      <div class="tw"><table>
        <thead><tr><th>Piesă</th><th>Preț unitar (lei)</th><th>Mărimi disponibile</th><th></th></tr></thead>
        <tbody>${D.piese.map(p=>`<tr data-id="${p.id}">
          <td>${esc(p.denumire)}</td>
          <td><input type="text" class="pr" inputmode="decimal" value="${p.pret_unitar===null?'':String(p.pret_unitar).replace('.',',')}" placeholder="0,00"></td>
          <td><input type="text" class="mar" value="${esc(p.marimi.join(', '))}"></td>
          <td><button class="primary sv">Salvează</button></td></tr>`).join('')}
        </tbody></table></div>
      <p class="err-msg" id="perr"></p>
    </div>`;
  document.querySelectorAll('button.sv').forEach(btn => btn.onclick = async () => {
    const tr = btn.closest('tr'), id = +tr.dataset.id, p = D.piese.find(x=>x.id===id);
    const raw = tr.querySelector('.pr').value.trim().replace(',','.');
    const pret = raw==='' ? null : Number(raw);
    const mar = tr.querySelector('.mar').value.split(',').map(s=>s.trim()).filter(Boolean);
    $('#perr').textContent='';
    if(pret!==null && (isNaN(pret)||pret<0)){ $('#perr').textContent='Preț invalid la '+p.denumire; return; }
    if(!mar.length || mar.some(m=>!/^\d+$/.test(m))){ $('#perr').textContent='Mărimile trebuie să fie numere separate prin virgulă ('+p.denumire+').'; return; }
    btn.disabled=true;
    try{
      await rpc('uniforme_seteaza_pret',{p_cod:cod,p_piesa_id:id,p_pret:pret});
      await rpc('uniforme_seteaza_marimi',{p_cod:cod,p_piesa_id:id,p_marimi:[...new Set(mar)]});
      await reload(); toast('Salvat: '+p.denumire); viewPret();
    }catch(err){ $('#perr').textContent=err.message; btn.disabled=false; }
  });
}

/* ---------- pornire ---------- */
(async function init(){
  const saved = load('uf_cod');
  if(saved){ cod = saved; try{ await reload(); start(); return; }catch(e){ cod=null; store('uf_cod',null); } }
  showLogin();
})();
</script>
</body>
</html>
