<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listă Prezență PNRAS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e40af; --accent: #10b981; --text: #1f2937; }
        @page { size: A4; margin: 1cm; }
        body { background: #f3f4f6; font-family: 'Inter', sans-serif; color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .page { 
            background: white; width: 210mm; min-height: 297mm; padding: 10mm 15mm; 
            box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border-radius: 8px; margin-bottom: 30px; page-break-after: always;
        }
        .antet-img { width: 100%; margin-bottom: 5px; border-bottom: 1px solid #eee; }
        h2 { font-family: 'Montserrat', sans-serif; color: black; text-align: center; text-transform: uppercase; margin: 10px 0; font-size: 20px; }
        .grid-info { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 10px 40px; margin-bottom: 20px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; border-left: 5px solid var(--primary); }
        .info-item { font-size: 12px; }
        .info-label { font-weight: 700; color: #4b5563; text-transform: uppercase; font-size: 10px; display: block; }
        .info-value { font-size: 14px; color: var(--text); font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-family: 'Roboto Mono', monospace; }
        th { background: #f8fafc; color: black; font-weight: 700; text-transform: uppercase; font-size: 11px; padding: 10px 5px; border: 1px solid black; text-align: center; }
        td { border: 1px solid black; padding: 8px 5px; font-size: 13px; color: black; text-align: center; vertical-align: middle; }
        .signature-area { margin-top: 50px; text-align: center; width: 100%; font-size: 14px; break-before: avoid; }
        .signature-anchor { break-inside: avoid; }
        .no-print { margin-bottom: 20px; display: flex; gap: 8px; justify-content: center; position: sticky; top: 10px; z-index: 1000; }
        .main-btn { padding: 10px 16px; cursor: pointer; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-back-bold { background: #000000 !important; color: #fff !important; border: 2px solid #fff !important; font-size: 14px !important; }
        .btn-back-bold span { color: #10b981 !important; font-size: 18px; font-weight: 900; }
        .btn-secondary { background: #4b5563; }
        .btn-success { background: #059669; }
        .btn-danger { background: #dc2626; }
        input.edit-name { border: none !important; outline: none !important; width: 100%; font-family: inherit; font-size: inherit; background: transparent; text-align: center; font-weight: 600; }
        /* ===== LISTĂ COMUNĂ PROIECT (toți elevii, o singură listă continuă) ===== */
        .proiect-table { width: 100%; border-collapse: collapse; font-family: 'Roboto Mono', monospace; }
        .proiect-table thead { display: table-header-group; } /* se repetă pe fiecare pagină printată */
        .proiect-table th, .proiect-table td { border: 1px solid black; padding: 8px 5px; font-size: 13px; text-align: center; vertical-align: middle; }
        .proiect-table .thead-antet td, .proiect-table .thead-titlu td, .proiect-table .thead-info td { border: none; padding: 4px 0; }
        .proiect-table .thead-cols th { background: #f8fafc; text-transform: uppercase; font-size: 11px; }
        @media print { .proiect-table tr { break-inside: avoid; } }
        .sig3 { display: flex; justify-content: space-between; gap: 20px; margin-top: 40px; }
        .sig3 .sb { flex: 1; text-align: center; font-size: 13px; line-height: 1.6; outline: none; }
        .sig3 .sb:focus { background: #f8fafc; }
        @media print { .no-print, #status-msg { display: none !important; } body { padding: 0; background: none; } .page { box-shadow: none; border-radius: 0; padding: 5mm; width: 100%; margin: 0; } }
    </style>
</head>
<body>

    <div id="master-container"></div>
    <template id="page-template">
        <div class="page">
            <img src="antet_pnras.jpeg" class="antet-img">
            <h2>Listă de prezență</h2>

                <div class="info-item" style="grid-column: span 2;"><span class="info-label">Activitate:</span><span class="out-activitate info-value"></span></div>

            </div>
            <div class="container-tabel">

                    <colgroup><col width="5%"><col width="55%"><col width="10%"><col width="10%"><col width="20%"></colgroup>
                    <thead><tr><th width="5%">Nr.</th><th width="55%">Nume și prenume elev</th><th width="10%">P</th><th width="10%">A</th><th width="20%">Semnătura</th></tr></thead>

                    <table style="width:100%; border-collapse:collapse; font-family:'Roboto Mono',monospace; table-layout:fixed; margin-top:-1px;">

                    </table>
                    <div class="signature-area"><p style="margin-bottom: 50px;">Întocmit,</p><p>Expert: <span class="sig-expert" style="font-weight: bold; text-decoration: underline;"></span></p></div>
                </div>
            </div>
        </div>
    </template>
<script>
    const URL_S = 'https://aexjrbdgajurxzngfkpx.supabase.co';
    const KEY_S = 'sb_publishable_KPV__0BA9z4EvRl5eqC0FQ_hmBLOLYv';
    const _supabase = supabase.createClient(URL_S, KEY_S);

    const MAP_ACTIVITATI = { 'A II.4.': ['Angheluș Raluca', 'Baziluc Ana Maria', 'Ghemeș Anca', 'Arotăriței Dănuț', 'Boldan Ovidiu', 'Popovici Estera', 'Iftene Ana Maria'], 'A II.5.': ['Albu Ștefan', 'Marele Daniela', 'Tanasă Liliana', 'Popa Gabriela', 'Nohai Iuliana', 'Nohai Vili'], 'A II.6.': ['Aparascăi Vasile'] };
    const DESC_ACTIVITATI = { 'A II.4.': 'A II. 4. Activități remediale și diverse activități pedagogice și de sprijin', 'A II.5.': 'A II.5. Activități extracurriculare și/sau extrașcolare', 'A II.6.': 'A II.6. Activități pentru dezvoltarea literației. Club de lectură' };
    const MAP_DISCIPLINE = { 'Angheluș Raluca': 'Activități remediale la limba și literatura română', 'Baziluc Ana Maria': 'Activități remediale la limba și literatura română', 'Ghemeș Anca': 'Activități remediale la limba și literatura română', 'Arotăriței Dănuț': 'Activități remediale la matematică', 'Boldan Ovidiu': 'Activități remediale la matematică', 'Popovici Estera': 'Activități remediale la matematică', 'Albu Ștefan': 'Activități extracurriculare la Clubul de activități sportive și outdoor', 'Marele Daniela': 'Activități extracurriculare la Clubul de pictură', 'Tanasă Liliana': 'Activități extracurriculare la Clubul de muzică', 'Popa Gabriela': 'Activități extracurriculare la Clubul de dansuri', 'Nohai Iuliana': 'Activități extracurriculare la Clubul de științe', 'Nohai Vili': 'Activități extracurriculare la Clubul de științe', 'Aparascăi Vasile': 'Activități extracurriculare la Clubul de lectură și literație', 'Iftene Ana Maria': 'Activități remediale la matematică' };
    const MAP_CLASE = { '5A': 'Clasa a V-a A', '5B': 'Clasa a V-a B', '5C': 'Clasa a V-a C', '6A': 'Clasa a VI-a A', '6B': 'Clasa a VI-a B', '6C': 'Clasa a VI-a C', '7A': 'Clasa a VII-a A', '7B': 'Clasa a VII-a B', '7C': 'Clasa a VII-a C', '8A': 'Clasa a VIII-a A', '8B': 'Clasa a VIII-a B', '8C': 'Clasa a VIII-a C', 'SG1': 'Grupa 1, Sport', 'SG2': 'Grupa 2, Sport', 'PG1': 'Grupa 1, Pictură', 'PG2': 'Grupa 2, Pictură', 'MG1': 'Grupa 1, Muzică', 'MG2': 'Grupa 2, Muzică', 'DG1': 'Grupa 1, Dansuri', 'StG1': 'Grupa 1, Științe', 'StG2': 'Grupa 1, Științe', 'SG1A': 'Grupa 1A, Sport', 'SG1B': 'Grupa 1B, Sport', 'PG1A': 'Grupa 1A, Pictură', 'PG1B': 'Grupa 1B, Pictură', 'StG1A': 'Grupa 1A, Științe', 'StG1B': 'Grupa 1B, Științe', 'AV5A': 'Clasa a V-a A', 'AV5B': 'Clasa a V-a B', 'AV6A': 'Clasa a VI-a A', 'AV6B': 'Clasa a VI-a B', 'AV7A': 'Clasa a VII-a A', 'AV7B': 'Clasa a VII-a B', 'AV8A1': 'Clasa a VIII-a A, Grupa 1', 'AV8A2': 'Clasa a VIII-a A, Grupa 2', 'AV8B1': 'Clasa a VIII-a B, Grupa 1', 'AV8B2': 'Clasa a VIII-a B, Grupa 2', 'AR5AB': 'Clasele a V-a A, B', 'AR5A': 'Clasa a V-a A', 'AR5B': 'Clasa a V-a B', 'AR6A': 'Clasa a VI-a A', 'AR6B': 'Clasa a VI-a B', 'AR7B': 'Clasa a VII-a B', 'BA6B': 'Clasa a VI-a B', 'BA7A': 'Clasa a VII-a A', 'BA8A1': 'Clasa a VIII-a A, Grupa 1', 'BA8A2': 'Clasa a VIII-a A, Grupa 2', 'BA8B': 'Clasa a VIII-a B', 'AD8B1': 'Clasa a VIII-a B, Grupa 1', 'AD8B2': 'Clasa a VIII-a B, Grupa 2', 'AD8B3': 'Clasa a VIII-a B, Grupa 3', 'PE8A1': 'Clasa a VIII-a A, Grupa 1', 'PE8A2': 'Clasa a VIII-a A, Grupa 2', 'PE6B1': 'Clasa a VI-a B, Grupa 1', 'PE6B2': 'Clasa a VI-a B, Grupa 2', 'PE7A': 'Clasa a VII-a A', 'IA5AB1': 'Clasele a V-a A, B', 'IA5AB2': 'Clasele a V-a A, B', 'IA6A': 'Clasa a VI-a A', 'IA7B': 'Clasa a VII-a B' };

    function toggleCheck(el, type) {
        const row = el.closest('tr');
        const p = row.querySelector('.p-check'), a = row.querySelector('.a-check');
        if (type === 'p' && p.checked) a.checked = false;
        if (type === 'a' && a.checked) p.checked = false;
    }
    function addRow() {
        const tbodyP = document.getElementById('tabel-body-proiect');
        if (tbodyP) {
            const proiect = new URLSearchParams(window.location.search).get('proiect') || '';
            const pSafe = proiect.replace(/'/g, "\\'");
            const nextNr = tbodyP.querySelectorAll('tr').length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="nr-cell">${nextNr}</td><td><input type="text" class="edit-name" placeholder="Nume Prenume" oninput="autoSaveProiect('${pSafe}')"></td><td><input type="checkbox" class="p-check" checked onclick="toggleCheck(this, 'p'); autoSaveProiect('${pSafe}')"></td><td><input type="checkbox" class="a-check" onclick="toggleCheck(this, 'a'); autoSaveProiect('${pSafe}')"></td><td></td>`;
            tbodyP.appendChild(tr);
            autoSaveProiect(proiect);
            return;
        }
        document.querySelectorAll('.page').forEach(pageDiv => {
            // Mută ultimul rând din footer înapoi în body (dacă există)
            const tfoot = pageDiv.querySelector('.tabel-footer');
            const tbody = pageDiv.querySelector('.tabel-body');
            if (tfoot && tfoot.lastElementChild) {
                tbody.appendChild(tfoot.lastElementChild);
            }
            // Adaugă noul rând în footer
            const allRows = [...tbody.querySelectorAll('tr'), ...(tfoot ? tfoot.querySelectorAll('tr') : [])];
            const nextNr = allRows.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="nr-cell">${nextNr}</td><td><input type="text" class="edit-name" placeholder="Nume Prenume"></td><td><input type="checkbox" class="p-check" checked onclick="toggleCheck(this, 'p')"></td><td><input type="checkbox" class="a-check" onclick="toggleCheck(this, 'a')"></td><td></td>`;
            if (tfoot) tfoot.appendChild(tr);
        });
        reindexAll();
    }
    function removeLastRow() {
        const tbodyP = document.getElementById('tabel-body-proiect');
        if (tbodyP) {
            const rows = tbodyP.querySelectorAll('tr');
            if (rows.length) rows[rows.length - 1].remove();
            reindexAll();
            autoSaveProiect(new URLSearchParams(window.location.search).get('proiect') || '');
            return;
        }
        document.querySelectorAll('.page').forEach(pageDiv => {
            const tfoot = pageDiv.querySelector('.tabel-footer');
            const tbody = pageDiv.querySelector('.tabel-body');
            if (tfoot && tfoot.lastElementChild) {
                tfoot.removeChild(tfoot.lastElementChild);
                // Mută ultimul din body în footer
                if (tbody && tbody.lastElementChild) {
                    tfoot.appendChild(tbody.lastElementChild);
                }
            } else if (tbody && tbody.lastElementChild) {
                tbody.removeChild(tbody.lastElementChild);
            }
        });
        reindexAll();
    }
    function reindexAll() {
        const tbodyP = document.getElementById('tabel-body-proiect');
        if (tbodyP) {
            tbodyP.querySelectorAll('.nr-cell').forEach((td, i) => td.textContent = i + 1);
            return;
        }
        document.querySelectorAll('.page').forEach(pageDiv => {
            const allCells = [...pageDiv.querySelectorAll('.tabel-body .nr-cell'), ...pageDiv.querySelectorAll('.tabel-footer .nr-cell')];
            allCells.forEach((td, i) => td.textContent = i + 1);
        });
    }

    // ===================== LISTĂ COMUNĂ PROIECT (toți elevii, editabilă, cu salvare) =====================
    const ANUL_CURENT_PROIECT = '2026'; // anul academic curent din mate_pnras (text)
    let _proiectSaveTimer = null;
    let _currentProiect = null;

    function sanitizeDocId(s) {
        return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9_\-]/g, '_');
    }

    async function preiaRosterComplet() {
        // Sursă corectă pentru toți elevii școlii: mate_pnras (nu 'elevi', care are duplicate pe grupe)
        // ATENȚIE: doar .select() — nicio operație de scriere/ștergere nu atinge vreodată mate_pnras.
        const { data: elevi } = await _supabase.from('mate_pnras')
            .select('nume_elev').eq('anul', ANUL_CURENT_PROIECT);
        const numeUnice = [...new Set((elevi || []).map(e => e.nume_elev).filter(Boolean))]
            .sort((a, b) => a.localeCompare(b, 'ro'));
        return numeUnice.map(n => ({ nume: n, p: true, a: false }));
    }

    async function revinoLaListaCompleta(proiect) {
        if (!proiect) return;
        if (!confirm('Sigur revii la lista completă cu toți elevii? Orice nume adăugat/șters/editat manual în lista curentă se va pierde. (Baza de date cu elevii — mate_pnras — nu e afectată, doar lista de aici.)')) return;
        const randuri = await preiaRosterComplet();
        const titlu = document.getElementById('pr-titlu')?.innerText || 'Listă de prezență — Proiect';
        const numeAfisat = document.getElementById('pr-nume')?.innerText || proiect;
        const intocmit = document.getElementById('pr-intocmit')?.innerHTML || 'Manager proiect,<br>prof. dr. Ciprian MIHAI';
        const aprobat = document.getElementById('pr-aprobat')?.innerHTML || 'Aprobat,<br>Director,<br>prof. Cătălin-Ionuț BAZILUC';
        randareTabelProiect(proiect, randuri, titlu, numeAfisat, intocmit, aprobat);
        await salveazaProiect(proiect);
    }

    async function incarcaDateProiect(proiect, expert) {
        _currentProiect = proiect;
        document.getElementById('btn-revino-lista').style.display = 'flex';
        document.getElementById('btn-back').onclick = () => {
            window.location.href = expert ? `dosar-expert.html?expert=${encodeURIComponent(expert)}` : `dosar-expert.html?mod=proiecte`;
        };

        const docId = 'LISTA_PREZENTA_PROIECT_' + sanitizeDocId(proiect);
        const { data: savedDoc } = await _supabase.from('planificari_documente')
            .select('continut_json').eq('tip_document', docId).maybeSingle();

        let randuri, titlu, numeAfisat, intocmit, aprobat;
        if (savedDoc && savedDoc.continut_json && Array.isArray(savedDoc.continut_json.randuri)) {
            const j = savedDoc.continut_json;
            randuri = j.randuri;
            titlu = j.titlu ?? 'Listă de prezență — Proiect';
            numeAfisat = j.numeAfisat ?? proiect;
            intocmit = j.intocmit ?? 'Manager proiect,<br>prof. dr. Ciprian MIHAI';
            aprobat = j.aprobat ?? 'Aprobat,<br>Director,<br>prof. Cătălin-Ionuț BAZILUC';
        } else {
            randuri = await preiaRosterComplet();
            titlu = 'Listă de prezență — Proiect';
            numeAfisat = proiect;
            intocmit = 'Manager proiect,<br>prof. dr. Ciprian MIHAI';
            aprobat = 'Aprobat,<br>Director,<br>prof. Cătălin-Ionuț BAZILUC';
        }

        randareTabelProiect(proiect, randuri, titlu, numeAfisat, intocmit, aprobat);
        document.getElementById('status-msg').style.display = 'none';
    }

    function randareTabelProiect(proiect, randuri, titlu, numeAfisat, intocmit, aprobat) {
        const master = document.getElementById('master-container');
        const pSafe = proiect.replace(/'/g, "\\'");
        const rows = randuri.map((r, i) => `
            <tr>
                <td class="nr-cell">${i + 1}</td>
                <td><input type="text" class="edit-name" value="${(r.nume || '').replace(/"/g, '&quot;')}" oninput="autoSaveProiect('${pSafe}')"></td>
                <td><input type="checkbox" class="p-check" ${r.p !== false ? 'checked' : ''} onclick="toggleCheck(this, 'p'); autoSaveProiect('${pSafe}')"></td>
                <td><input type="checkbox" class="a-check" ${r.a === true ? 'checked' : ''} onclick="toggleCheck(this, 'a'); autoSaveProiect('${pSafe}')"></td>
                <td></td>
            </tr>`).join('');

        master.innerHTML = `
            <div class="page" style="min-height:auto;">
                <table class="proiect-table">
                    <thead>
                        <tr class="thead-antet"><td colspan="5"><img src="antet_pnras.jpeg" class="antet-img"></td></tr>
                        <tr class="thead-titlu"><td colspan="5"><h2 id="pr-titlu" contenteditable="true" oninput="autoSaveProiect('${pSafe}')">${titlu}</h2></td></tr>
                        <tr class="thead-info"><td colspan="5">
                            <div class="grid-info" style="margin-bottom:0;">
                                <div class="info-item" style="grid-column: span 2;"><span class="info-label">Proiect:</span> <span class="info-value" id="pr-nume" contenteditable="true" oninput="autoSaveProiect('${pSafe}')">${numeAfisat}</span></div>
                            </div>
                        </td></tr>
                        <tr class="thead-cols"><th style="width:5%;">Nr.</th><th style="width:55%;">Nume și prenume elev</th><th style="width:10%;">P</th><th style="width:10%;">A</th><th style="width:20%;">Semnătura</th></tr>
                    </thead>
                    <tbody id="tabel-body-proiect">${rows}</tbody>
                </table>
                <div class="sig3">
                    <div class="sb" id="pr-intocmit" contenteditable="true" oninput="autoSaveProiect('${pSafe}')">${intocmit}</div>
                    <div class="sb" id="pr-aprobat" contenteditable="true" oninput="autoSaveProiect('${pSafe}')">${aprobat}</div>
                </div>
            </div>
        `;
    }

    function autoSaveProiect(proiect) {
        if (!proiect) return;
        clearTimeout(_proiectSaveTimer);
        _proiectSaveTimer = setTimeout(() => salveazaProiect(proiect), 1200);
    }

    async function salveazaProiect(proiect) {
        const tbodyP = document.getElementById('tabel-body-proiect');
        if (!tbodyP) return;
        const randuri = [...tbodyP.querySelectorAll('tr')].map(tr => ({
            nume: tr.querySelector('.edit-name').value,
            p: tr.querySelector('.p-check').checked,
            a: tr.querySelector('.a-check').checked
        }));
        const docId = 'LISTA_PREZENTA_PROIECT_' + sanitizeDocId(proiect);
        await _supabase.from('planificari_documente').upsert({
            tip_document: docId,
            an: 0,
            luna: 'PROIECT',
            continut_json: {
                randuri,
                titlu: document.getElementById('pr-titlu')?.innerText ?? '',
                numeAfisat: document.getElementById('pr-nume')?.innerText ?? '',
                intocmit: document.getElementById('pr-intocmit')?.innerHTML ?? '',
                aprobat: document.getElementById('pr-aprobat')?.innerHTML ?? ''
            },
            expert: 'PROIECT_COMUN'
        }, { onConflict: 'tip_document' });
    }

    async function incarcaDate() {
        try {
            const params = new URLSearchParams(window.location.search);
            const proiect = params.get('proiect');
            if (proiect) {
                await incarcaDateProiect(proiect, params.get('expert'));
                return;
            }
            const expert = params.get('expert'), clasaCod = params.get('clasa'), luna = params.get('luna'), an = params.get('an');
            document.getElementById('btn-back').onclick = () => { window.location.href = `dosar-expert.html?expert=${encodeURIComponent(expert)}`; };
            const { data: pontaje } = await _supabase.from('pontaj_detaliat').select('zi').eq('expert', expert).ilike('clase_grupe', `%${clasaCod}%`).eq('luna', luna).eq('an', an).order('zi', { ascending: true });
            if (!pontaje || pontaje.length === 0) { document.getElementById('status-msg').textContent = "⚠️ Nu s-au găsit activități."; return; }
            const { data: elevi } = await _supabase.from('elevi').select('nume_complet').eq('clasa_grupa', clasaCod).order('nume_complet', { ascending: true });
            const master = document.getElementById('master-container');
            const template = document.getElementById('page-template').content;
            pontaje.forEach(p => {
                const clone = document.importNode(template, true);
                let actCod = "";
                for (let k in MAP_ACTIVITATI) if (MAP_ACTIVITATI[k].includes(expert)) actCod = k;
                clone.querySelector('.out-activitate').textContent = DESC_ACTIVITATI[actCod] || "---";
                clone.querySelector('.out-disciplina').textContent = MAP_DISCIPLINE[expert] || "---";
                clone.querySelector('.out-expert').textContent = expert;
                clone.querySelector('.sig-expert').textContent = expert;
                clone.querySelector('.out-clasa').textContent = MAP_CLASE[clasaCod] || clasaCod;
                clone.querySelector('.out-data').textContent = `${p.zi} ${luna} ${an}`.trim();
                const pageDiv = clone.querySelector('.page');
                if (elevi) {
                    elevi.forEach((e, i) => {
                        const isLast = i === elevi.length - 1;
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td class="nr-cell">${i+1}</td><td><input type="text" class="edit-name" value="${e.nume_complet}"></td><td><input type="checkbox" class="p-check" checked onclick="toggleCheck(this, 'p')"></td><td><input type="checkbox" class="a-check" onclick="toggleCheck(this, 'a')"></td><td></td>`;
                        if (isLast) {
                            pageDiv.querySelector('.tabel-footer').appendChild(tr);
                        } else {
                            pageDiv.querySelector('.tabel-body').appendChild(tr);
                        }
                    });
                }
                master.appendChild(clone);
            });
            document.getElementById('status-msg').style.display = 'none';
        } catch (err) { console.error(err); }
    }
    document.addEventListener('DOMContentLoaded', incarcaDate);
</script>
</body>
</html>
